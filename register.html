<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | Verdant Life</title>
  <meta name="description" content="Register as a new patient at Verdant Life Naturopathy & Yoga Therapy Center to begin your personalized wellness journey.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <script>
    (function() {
      if (localStorage.getItem('verdant-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      if (localStorage.getItem('verdant-direction') === 'rtl') {
        document.documentElement.setAttribute('dir', 'rtl');
      }
    })();
  </script>
</head>
<body class="auth-page">

  <!-- Top Header Bar with Utilities -->
  <div class="auth-header-bar">
    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <button class="icon-btn theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
        <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon-moon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="icon-btn rtl-toggle-btn" aria-label="Toggle text direction" title="Toggle RTL / LTR">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Focused Card Content Alone -->
  <div class="auth-card">
    <!-- Website Brand Name Inside Card (Top) -->
    <a href="index.html" class="auth-card-brand" title="Verdant Life Sanctuary">
      <div class="brand-symbol"><img src="images/logo.png" alt="Verdant Life Logo"></div>
      <div class="brand-text">
        <span class="brand-name">VERDANT LIFE</span>
        <span class="brand-tagline">Naturopathy & Yoga Therapy</span>
      </div>
    </a>

    <div class="auth-logo">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Register to manage your naturopathy appointments, treatment journeys, and receipts.</p>
    </div>

    <form onsubmit="handleRegisterSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Legal Name *</label>
        <input type="text" id="reg-name" class="form-control" required placeholder="e.g. Eleanor Vance">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address *</label>
        <input type="email" id="reg-email" class="form-control" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-phone">Phone Number *</label>
        <input type="tel" id="reg-phone" class="form-control" required placeholder="+1 (555) 000-0000">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-interest">Primary Wellness Interest</label>
        <select id="reg-interest" class="form-control">
          <option value="Therapeutic Yoga">Therapeutic Yoga (Hatha / Restorative)</option>
          <option value="Naturopathy Treatments">Naturopathy Treatments (Hydro / Mud)</option>
          <option value="Nutrition Guidance">Personalized Nutrition Guidance</option>
          <option value="Mind & Body Wellness">Mind & Body Relaxation</option>
          <option value="Complete Sanctuary Retreat">Complete Sanctuary Retreat</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-pwd">Create Password *</label>
        <input type="password" id="reg-pwd" class="form-control" required placeholder="At least 8 characters">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm">Confirm Password *</label>
        <input type="password" id="reg-confirm" class="form-control" required placeholder="Re-enter password">
      </div>

      <div style="margin-bottom: 1.25rem; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
        <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" required style="accent-color: var(--accent-terracotta); margin-top: 3px;">
          <span>I agree to the sanctuary privacy guidelines and acknowledge that center services provide natural lifestyle care.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary">Complete Registration</button>
    </form>

    <div class="auth-divider"><span>or continue with</span></div>

    <div class="auth-social-buttons">
      <button type="button" class="auth-social-btn auth-google-btn" onclick="showToast('Connecting to Google Identity Services...');">
        <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <button type="button" class="auth-social-btn auth-apple-btn" onclick="showToast('Connecting to Apple ID Authentication...');">
        <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.56.64-.99 1.71-.85 2.72 1.01.08 2.01-.52 2.58-1.22z"/>
        </svg>
        <span>Continue with Apple</span>
      </button>
    </div>

    <div class="auth-footer-link">
      Already have an account? <a href="login.html">Sign In Here</a>
    </div>


  </div>

  <script src="js/main.js"></script>
  <!-- Drop to Top Button with Hover Effect -->
  <button id="backToTop" class="back-to-top-btn" aria-label="Scroll to top of page" title="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>
</body>
</html>
